name: Deploy Hostinger

# USANG (keputusan 2026-11-16): hosting pindah ke Hostinger Node.js SSR, yang membangun
# sendiri dari GitHub (docs/hosting-hostinger.md). Deploy statis lewat FTPS tidak lagi
# valid: dist/ sekarang berisi server Node dan endpoint form, bukan situs statis.
# Dinonaktifkan: hanya manual (workflow_dispatch) dan job selalu dilewati.
# Berkas dipertahankan (GR-9); hapus setelah pemilik memutuskan.

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-hostinger
  cancel-in-progress: false

jobs:
  deploy:
    name: Build + unggah dist/ ke Hostinger
    if: ${{ false }}
    runs-on: ubuntu-latest
    env:
      SITE_URL: ${{ vars.SITE_URL }}
      PUBLIC_UMAMI_ID: ${{ vars.PUBLIC_UMAMI_ID }}
    steps:
      - name: Cek konfigurasi
        env:
          HOSTINGER_FTP_SERVER: ${{ secrets.HOSTINGER_FTP_SERVER }}
          HOSTINGER_FTP_USERNAME: ${{ secrets.HOSTINGER_FTP_USERNAME }}
          HOSTINGER_FTP_PASSWORD: ${{ secrets.HOSTINGER_FTP_PASSWORD }}
          HOSTINGER_FTP_DIR: ${{ secrets.HOSTINGER_FTP_DIR }}
        run: |
          missing=0
          for n in SITE_URL HOSTINGER_FTP_SERVER HOSTINGER_FTP_USERNAME HOSTINGER_FTP_PASSWORD HOSTINGER_FTP_DIR; do
            if [ -z "${!n}" ]; then echo "::error::$n belum diisi"; missing=1; fi
          done
          exit $missing
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - run: npm run build
      # Tes yang sama dengan CI tahap 6, dengan SITE_URL produksi/staging. Gagal = tidak diunggah.
      - run: npm run test:dist
      # Pin ke SHA commit rilis v4.4.0 (SamKirkland/FTP-Deploy-Action). Perbarui lewat PR.
      - uses: SamKirkland/FTP-Deploy-Action@110f9186c050f71550953127052e77650219c287 # v4.4.0
        with:
          server: ${{ secrets.HOSTINGER_FTP_SERVER }}
          username: ${{ secrets.HOSTINGER_FTP_USERNAME }}
          password: ${{ secrets.HOSTINGER_FTP_PASSWORD }}
          protocol: ftps
          local-dir: ./dist/
          server-dir: ${{ secrets.HOSTINGER_FTP_DIR }}
