name: Publish deploy branch

# USANG (keputusan 2026-11-16): hosting pindah ke Hostinger Node.js SSR, yang membangun
# sendiri dari branch GitHub yang dipilih (docs/hosting-hostinger.md). Branch `deploy`
# berisi hasil build statis tanpa server/endpoint form, jadi tidak lagi dipakai.
# Dinonaktifkan: hanya manual (workflow_dispatch) dan job selalu dilewati.
# Berkas dipertahankan (GR-9); hapus setelah pemilik memutuskan.

on:
  workflow_dispatch:

concurrency:
  group: publish-deploy-branch
  cancel-in-progress: false

jobs:
  publish:
    name: Build + terbitkan dist/ ke branch deploy
    if: ${{ false }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      SITE_URL: ${{ vars.SITE_URL || 'https://biadenrekacipta.com' }}
      PUBLIC_UMAMI_ID: ${{ vars.PUBLIC_UMAMI_ID }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - run: npm run build
      # Tes yang sama dengan CI tahap 6, dengan SITE_URL yang sama dengan build. Gagal = tidak diterbitkan.
      - run: npm run test:dist
      - name: Terbitkan isi dist/ ke branch deploy
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          SOURCE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          out="$(mktemp -d)"
          cp -a dist/. "$out/"
          cd "$out"
          git init -q -b deploy
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "deploy: ${SOURCE_SHA}"
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${REPO}.git"
          git push --force origin deploy
          echo "Isi branch deploy:"
          git ls-tree -r HEAD --name-only | head -50
